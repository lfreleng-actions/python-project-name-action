---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# python-project-name-action
name: "🐍 Python Project/Package Names"
description: "Extracts Python project name and derives the package name"

inputs:
  # Optional
  path_prefix:
    description: "Directory location containing project code"
    required: false
    default: '.'

outputs:
  # Mandatory
  python_project_file:
    # Supports pyproject.toml, setup.cfg and setup.py
    description: "File used to extract/parse project metadata"
    value: ${{ steps.capture.outputs.python_project_file }}
  python_project_name:
    description: >-
      Name of the Python project from pyproject.toml/setup.cfg/setup.py
    value: ${{ steps.capture.outputs.python_project_name }}
  python_package_name:
    # Note: dashes in the name are substituted with underscores
    description: "The name of the Python package"
    value: ${{ steps.capture.outputs.python_package_name }}
  source:
    description: >-
      Source file where project details were found
      (pyproject.toml, setup.cfg or setup.py)
    value: ${{ steps.capture.outputs.source }}

runs:
  using: "composite"
  steps:
    - name: "Setup action/environment"
      id: setup
      shell: bash
      env:
        # Pass the input via the environment rather than interpolating
        # it directly into the script body, so a hostile value cannot
        # break out of shell quoting (zizmor: template-injection).
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Setup action/environment

        # Handle path_prefix input consistently and when absent
        path_prefix="$INPUT_PATH_PREFIX"
        if [ -z "$path_prefix" ]; then
          # Set current directory as path prefix
          path_prefix="."
        else
          # Strip any trailing slash in provided path
          path_prefix="${path_prefix%/}"
        fi
        # Verify is a valid directory path
        if [ ! -d "$path_prefix" ]; then
          echo "Error: invalid path/prefix to project directory ❌"; exit 1
        fi
        # Emit via the documented multiline-delimiter form so a value
        # containing newlines cannot append additional output keys
        # (output-injection hardening).
        delimiter="ghadelimiter_${RANDOM}${RANDOM}${RANDOM}"
        {
          printf '%s<<%s\n' "path_prefix" "$delimiter"
          printf '%s\n' "$path_prefix"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"

    # Check for pyproject.toml first (preferred)
    # yamllint disable-line rule:line-length
    - uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c # v0.2.2
      id: pyproject-toml
      with:
        path: "${{ steps.setup.outputs.path_prefix }}/pyproject.toml"

    - name: "Get project name from pyproject.toml"
      id: pyproject-name
      if: steps.pyproject-toml.outputs.type == 'file'
      shell: bash
      env:
        ENV_PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Extract the project name from pyproject.toml
        #
        # A pyproject.toml may legitimately carry only a [build-system]
        # table (PEP 517) with no [project] name, e.g. pbr / setuptools
        # projects that keep metadata in setup.cfg. An empty result is
        # not an error here; the caller falls through to setup.cfg and
        # setup.py.

        toml="$ENV_PATH_PREFIX/pyproject.toml"
        # Parse the file with tomllib (Python 3.11+) so that every valid
        # TOML spelling of the name is read. Only [project] name (PEP
        # 621) and, failing that, [tool.poetry] name (Poetry 1.x) count;
        # a `name` key in any other table (e.g. [[tool.uv.index]]) is
        # ignored.
        #
        # Only names matching a PEP 508-style project-name charset are
        # accepted, as in the setup.cfg step, so a hostile pyproject.toml
        # cannot inject shell syntax into later steps. The parser checks
        # the whole string before printing it: command substitution
        # drops NUL bytes, so a check made only after capture would
        # accept "foo\u0000bar" as "foobar".
        pep508='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
        parsed="false"
        if command -v python3 > /dev/null 2>&1 && \
          name=$(python3 - "$toml" "$pep508" <<'PY'
        import re
        import sys

        try:
            import tomllib
        except ImportError:
            sys.exit(3)
        try:
            with open(sys.argv[1], "rb") as toml_file:
                data = tomllib.load(toml_file)
        except (OSError, tomllib.TOMLDecodeError) as exc:
            print(f"Unable to parse pyproject.toml: {exc}", file=sys.stderr)
            sys.exit(4)


        def lookup(table, *keys):
            for key in keys:
                table = table.get(key) if isinstance(table, dict) else None
            return table if isinstance(table, str) else ""


        name = lookup(data, "project", "name")
        name = name or lookup(data, "tool", "poetry", "name")
        if name and not re.fullmatch(sys.argv[2], name):
            print(
                f"Rejecting non-PEP-508 name from pyproject.toml: {name!r}",
                file=sys.stderr,
            )
            name = ""
        print(name)
        PY
          ); then
          parsed="true"
        fi
        # Without Python 3.11+, or when tomllib rejects the file, fall
        # back to a line-based match scoped to the same two tables that
        # accepts either quote style and any whitespace around `=`.
        # TOML forbids raw NUL bytes, and some awk implementations pass
        # them through for command substitution to drop, so skip the
        # fallback for any file that holds one.
        if [ "$parsed" != "true" ] && \
          [ "$(tr -d '\000' < "$toml" | wc -c)" -ne "$(wc -c < "$toml")" ]; then
          echo "Ignoring pyproject.toml: it contains NUL bytes ⚠️"
          name=""
        elif [ "$parsed" != "true" ]; then
          echo "Parsing pyproject.toml without tomllib ⚠️"
          name=$(awk -v sq="'" -v dq='"' '
            /^[[:space:]]*\[/ {
              table=$0
              sub(/#.*$/, "", table)
              gsub(/[[:space:]]/, "", table)
              next
            }
            (table == "[project]" || table == "[tool.poetry]") &&
            /^[[:space:]]*name[[:space:]]*=/ {
              value=$0
              sub(/^[[:space:]]*name[[:space:]]*=[[:space:]]*/, "", value)
              quote=substr(value, 1, 1)
              end=0
              if (quote == sq || quote == dq) {
                value=substr(value, 2)
                end=index(value, quote)
              }
              value=(end > 1) ? substr(value, 1, end - 1) : ""
              # As with tomllib, only a non-empty string counts; otherwise
              # [tool.poetry] name may still supply the project name
              if (table == "[project]" && value != "") {
                project=value
                found=1
                exit
              }
              if (table == "[tool.poetry]" && poetry == "") poetry=value
            }
            END { print (found ? project : poetry) }
          ' "$toml")
        fi
        # Check again here, for the fallback's result. Match the whole
        # string: an embedded newline would pass a line-based grep.
        if [[ ! "$name" =~ $pep508 ]]; then
          if [ -n "$name" ]; then
            # %q keeps an embedded newline from starting a log line that
            # the runner would parse as a workflow command.
            printf 'Rejecting non-PEP-508 name from pyproject.toml: %q ⚠️\n' \
              "$name"
          fi
          name=""
        fi
        delim="EOF_${RANDOM}_${RANDOM}_$$"
        {
          echo "extracted_string<<$delim"
          printf '%s\n' "$name"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$name" ]; then
          echo "Found name in pyproject.toml: $name 💬"
        else
          echo "No project name found in pyproject.toml ⚠️"
        fi

    # Fall back to setup.cfg ([metadata] name) for legacy pbr/setuptools.
    # This runs whenever pyproject.toml did not yield a project name,
    # whether the file is absent or carries only a [build-system] table.
    # yamllint disable-line rule:line-length
    - uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c # v0.2.2
      id: setup-cfg
      if: steps.pyproject-name.outputs.extracted_string == ''
      with:
        path: "${{ steps.setup.outputs.path_prefix }}/setup.cfg"

    - name: "Get project name from setup.cfg"
      id: setup-cfg-name
      if: >-
        steps.pyproject-name.outputs.extracted_string == '' &&
        steps.setup-cfg.outputs.type == 'file'
      shell: bash
      env:
        ENV_PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Extract [metadata] name from setup.cfg
        #
        # Scope the match strictly to the [metadata] section so an
        # unrelated `name =` (e.g. under [options.entry_points]) is
        # not picked up. An empty / missing value is not an error
        # here; the caller will fall through to setup.py.

        # path_prefix is provided by the setup step's output, passed in
        # via this step's env block rather than expanding a template into
        # this run block (zizmor: template-injection).
        cfg="$ENV_PATH_PREFIX/setup.cfg"
        # Match setup.cfg parsing semantics used by configparser
        # (setuptools/pbr): section names and option keys are
        # case-insensitive; either `=` or `:` may delimit the
        # key/value pair; and both `#` and `;` introduce inline
        # comments. Normalize to lowercase before matching.
        #
        # configparser rejects raw NUL bytes, and some awk
        # implementations pass them through for command substitution to
        # drop (turning foo<NUL>bar into foobar), so skip the file.
        if [ "$(tr -d '\000' < "$cfg" | wc -c)" -ne "$(wc -c < "$cfg")" ]; then
          echo "Ignoring setup.cfg: it contains NUL bytes ⚠️"
          name=""
        else
          name=$(awk '
            /^[[:space:]]*\[/ {
              section=$0
              sub(/^[[:space:]]*\[[[:space:]]*/, "", section)
              sub(/[[:space:]]*\][[:space:]]*$/, "", section)
              section=tolower(section)
              next
            }
            {
              line=$0
            }
            section == "metadata" && \
              tolower(line) ~ /^[[:space:]]*name[[:space:]]*[=:]/ {
              sub(/^[[:space:]]*[^=:]+[=:][[:space:]]*/, "", line)
              sub(/[[:space:]]*([#;].*)?$/, "", line)
              print line
              exit
            }
          ' "$cfg")
        fi
        # Defence in depth: only accept names matching a PEP 508-style
        # project-name charset. Anything else (quotes, newlines, shell
        # metacharacters) is treated as no match and falls through to
        # setup.py, so a hostile setup.cfg cannot inject shell syntax
        # into later steps that expand this output. Match the whole
        # string, as for pyproject.toml and setup.py.
        pep508='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
        if [[ ! "$name" =~ $pep508 ]]; then
          if [ -n "$name" ]; then
            # %q keeps the value on one line in the log
            printf 'Rejecting non-PEP-508 name from setup.cfg: %q ⚠️\n' \
              "$name"
          fi
          name=""
        fi
        # Write output via the documented multiline delimiter form so
        # that any unexpected newlines or special characters in the
        # extracted value cannot inject additional step outputs.
        # See:
        # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
        # Use bash-only primitives ($RANDOM and $$) to build a
        # delimiter unlikely to collide with content. Avoids a
        # dependency on `uuidgen`, which may be absent in minimal
        # runner / container images.
        delim="EOF_${RANDOM}_${RANDOM}_$$"
        {
          echo "extracted_string<<$delim"
          printf '%s\n' "$name"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$name" ]; then
          echo "Found name in setup.cfg [metadata]: $name 💬"
        else
          echo "No [metadata] name found in setup.cfg ⚠️"
        fi

    # Fall back to setup.py if neither pyproject.toml nor setup.cfg
    # yielded a usable project name
    # yamllint disable-line rule:line-length
    - uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c # v0.2.2
      id: setup-py
      if: >-
        steps.pyproject-name.outputs.extracted_string == '' &&
        (steps.setup-cfg.outputs.type != 'file' ||
         steps.setup-cfg-name.outputs.extracted_string == '')
      with:
        path: "${{ steps.setup.outputs.path_prefix }}/setup.py"

    - name: "Get project name from setup.py"
      id: setup-name
      if: >-
        steps.pyproject-name.outputs.extracted_string == '' &&
        (steps.setup-cfg.outputs.type != 'file' ||
         steps.setup-cfg-name.outputs.extracted_string == '') &&
        steps.setup-py.outputs.type == 'file'
      shell: bash
      env:
        ENV_PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Extract the name passed to setup() in setup.py

        setup_py="$ENV_PATH_PREFIX/setup.py"
        # Read the `name` keyword of the setup() call from the syntax
        # tree, which accepts any quoting and spacing and ignores
        # identifiers such as `package_name`. A non-literal value
        # (e.g. name=NAME) yields no name rather than a wrong one. As in
        # the pyproject.toml step, the parser applies the PEP 508-style
        # check before printing, since command substitution drops NUL
        # bytes and would turn "foo\x00bar" into "foobar".
        pep508='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
        parsed="false"
        if command -v python3 > /dev/null 2>&1 && \
          name=$(python3 - "$setup_py" "$pep508" <<'PY'
        import ast
        import builtins
        import contextlib
        import re
        import sys

        if sys.version_info < (3, 8):
            sys.exit(3)
        try:
            with open(sys.argv[1], "rb") as setup_file:
                tree = ast.parse(setup_file.read(), sys.argv[1])
        except (OSError, SyntaxError, ValueError) as exc:
            print(f"Unable to parse setup.py: {exc}", file=sys.stderr)
            sys.exit(4)
        # Accept setup() only from a packaging module, however it is
        # imported, so helper.setup(...) or a setup imported from another
        # module cannot supply the name. Imports and definitions apply in
        # source order and each call is judged against the bindings in
        # force at that point, so a later import of setup from elsewhere
        # shadows a packaging one. A bare setup() counts only when bound
        # to a packaging setup, by an import or a star import from a
        # packaging module; a local def or assignment of setup does not.
        PACKAGING = {
            "setuptools",
            "distutils.core",
            "numpy.distutils.core",
            "skbuild",
        }


        def dotted(node):
            if isinstance(node, ast.Name):
                return node.id
            if isinstance(node, ast.Attribute):
                base = dotted(node.value)
                return f"{base}.{node.attr}" if base else ""
            return ""


        # How setup.py is analysed. The file is never run: its control
        # flow is followed statically, under these deliberate limits.
        # - Conditions are not evaluated. Either branch of an if (even
        #   `if True`), a loop body (any number of times, including none),
        #   a match case, an except handler, and the else clause of a loop
        #   or try may or may not run, as may a later and/or operand, a
        #   conditional expression's branches, a comprehension's body, an
        #   assert's message and a chained comparison's later operands.
        # - A statement is taken to complete unless it is, or contains,
        #   a return, break or continue, or certainly raises: raise,
        #   sys.exit(), exit(), quit(), or assert on a false constant
        #   (see raised; python -O, which drops asserts, is not
        #   considered). An exit call also stops the rest of its own
        #   expression (see HALTED). That any call may raise is not
        #   modelled, except that a try's handlers and else clause are
        #   always uncertain, even where the try body's outcome could be
        #   told.
        # - A raise is caught by an enclosing try in the same scope when a
        #   handler matches it, through the bases of classes this file
        #   defines (by name, or Outer.Inner inside a class body) and then
        #   the built-in exception hierarchy (see catches). An exception
        #   that cannot be told (a bare re-raise, a variable, an imported
        #   class, a class name defined more than once) is caught only by
        #   its own name, BaseException or a bare except. Context managers
        #   are taken not to suppress exceptions.
        # - Names are resolved from how the file binds them anywhere (see
        #   binding_origins), not per scope. exit() and quit() count as
        #   exits unless the file binds those names; sys.exit() through
        #   import sys [as s] or from sys import exit [as e], when that is
        #   the only way the file binds the name. A name the file binds
        #   never takes a built-in exception's hierarchy. os._exit() and
        #   star imports are not followed.
        # - Code runs CERTAIN, AFTER_EXIT (after a statement that may have
        #   left its block) or POSSIBLE (see path_level). The project's
        #   setup() call is the one most surely reached: by how surely its
        #   scope runs, then how surely it runs there, then source order.
        # - Only calls by plain name are followed between functions, and
        #   only to undecorated, non-async, non-generator functions;
        #   methods, callbacks and lambdas are not. A function body is
        #   analysed with the module's final bindings, and a handler starts
        #   from the bindings before or after its try body, not from those
        #   at the statement that raised.

        # A name's binding is the set of kinds it may refer to, across
        # the control flow paths that reach a point; UNBOUND marks a path
        # on which it was never bound. A def binds its name to a kind of
        # its own, ("def", id(node)), so a call can tell which function
        # it reaches.
        UNBOUND = "unbound"


        def bind(bindings, name, kind):
            # Bind a name to one kind. Rebinding a name also cuts off
            # anything recorded beneath it: once distutils is rebound,
            # distutils.core no longer reaches the packaging module
            for key in [k for k in bindings if k.startswith(f"{name}.")]:
                bindings[key] = frozenset({"other"})
            bindings[name] = frozenset({kind})


        def kinds(bindings, name):
            # What a name may refer to, ignoring paths on which it is
            # unbound: calling an unbound name fails rather than run setup
            return bindings.get(name, frozenset()) - {UNBOUND}


        def bind_import(node, bindings):
            # Record what each local name refers to: "setup" for a
            # packaging setup(), "module" for a packaging module, "other"
            # for anything else. A later import replaces an earlier one.
            if isinstance(node, ast.ImportFrom):
                module = node.module if node.level == 0 else None
                for alias in node.names:
                    if alias.name == "*":
                        # A star import binds setup when the module has it
                        packaging = module in PACKAGING
                        kind = "setup" if packaging else "other"
                        bind(bindings, "setup", kind)
                        continue
                    local = alias.asname or alias.name
                    if f"{module}.{alias.name}" in PACKAGING:
                        bind(bindings, local, "module")
                    elif module in PACKAGING and alias.name == "setup":
                        bind(bindings, local, "setup")
                    else:
                        bind(bindings, local, "other")
                return
            for alias in node.names:
                if alias.asname:
                    packaging = alias.name in PACKAGING
                    kind = "module" if packaging else "other"
                    bind(bindings, alias.asname, kind)
                    continue
                # `import a.b.c` binds a, reaching a.b and a.b.c too; the
                # paths beneath a are recorded after a is rebound. If a
                # already names an imported module, it is the same module
                # object, so paths recorded beneath it stay reachable.
                parts = alias.name.split(".")
                if bindings.get(parts[0]) != frozenset({"imported"}):
                    bind(bindings, parts[0], "imported")
                for end in range(1, len(parts) + 1):
                    if ".".join(parts[:end]) in PACKAGING:
                        bindings[".".join(parts[:end])] = frozenset({"module"})


        def target_names(target):
            # The names an assignment target binds: a plain name, and the
            # names inside tuple/list unpacking and *starred parts. The
            # base of x.attr = ... or x[i] = ... is not rebound.
            if isinstance(target, ast.Name):
                yield target.id
            elif isinstance(target, ast.Starred):
                yield from target_names(target.value)
            elif isinstance(target, (ast.Tuple, ast.List)):
                for element in target.elts:
                    yield from target_names(element)


        def bound_names(node):
            # The names a definition or binding statement rebinds
            if isinstance(node, BINDS_BY_NAME):
                return [node.name]
            if isinstance(node, ast.ExceptHandler):
                return [node.name] if node.name else []
            if isinstance(node, MATCH_CAPTURES):
                # case x, case [*x], case {**x} and case ... as x
                captured = getattr(node, "name", None)
                captured = captured or getattr(node, "rest", None)
                return [captured] if captured else []
            if isinstance(node, ast.Assign):
                targets = node.targets
            elif isinstance(node, ast.Delete):
                # del x unbinds x; del x.attr and del x[i] leave x bound
                targets = node.targets
            elif isinstance(node, ast.AnnAssign) and node.value is None:
                # x: T declares x without binding it
                targets = []
            else:
                # AnnAssign, AugAssign, For, AsyncFor and NamedExpr
                targets = [node.target]
            return [
                name
                for target in targets
                if target is not None
                for name in target_names(target)
            ]


        def bind_definition(node, bindings):
            # A definition or binding statement rebinds its names to
            # something local, which is never a packaging setup; del
            # leaves a name unbound, so a later call on that path fails
            # rather than reach anything
            kind = UNBOUND if isinstance(node, ast.Delete) else "other"
            if runs_body_when_called(node):
                kind = ("def", id(node))
            aliased = aliased_functions(node, bindings)
            for name in bound_names(node):
                bind(bindings, name, kind)
                if aliased:
                    bindings[name] = aliased


        def runs_body_when_called(node):
            # Whether calling what a def binds runs its body: not when a
            # decorator may have replaced the function, nor for an async
            # or generator function, whose call only creates a coroutine
            # or generator
            if not isinstance(node, ast.FunctionDef) or node.decorator_list:
                return False
            generator = (ast.Yield, ast.YieldFrom)
            return not any(isinstance(n, generator) for n in body_nodes(node))


        def aliased_functions(node, bindings):
            # x = f, where f can only be functions defined here, makes x
            # refer to those same functions
            plain = isinstance(node, ast.Assign) and all(
                isinstance(target, ast.Name) for target in node.targets
            )
            if not plain or not isinstance(node.value, ast.Name):
                return None
            found = kinds(bindings, node.value.id)
            if found and all(isinstance(kind, tuple) for kind in found):
                return frozenset(found)
            return None


        def is_setup(func, bindings):
            # A packaging setup() on every path that binds the name
            if isinstance(func, ast.Name):
                return kinds(bindings, func.id) == {"setup"}
            if isinstance(func, ast.Attribute) and func.attr == "setup":
                return kinds(bindings, dotted(func.value)) == {"module"}
            return False


        # The imports, calls and definitions belonging to one scope, in
        # any order. Nested function and class bodies are not entered: a
        # def or class still binds its name here, but its body is a scope
        # of its own that may never run, and a lambda neither binds nor
        # runs here. Statements in if/try/with/for/while blocks belong
        # to the scope that contains them, so those are included.
        SKIPPED_SCOPES = (
            ast.FunctionDef,
            ast.AsyncFunctionDef,
            ast.ClassDef,
            ast.Lambda,
        )


        def parameter_nodes(spec):
            # Every parameter of a def or lambda signature
            params = [*spec.posonlyargs, *spec.args, *spec.kwonlyargs]
            return params + [p for p in (spec.vararg, spec.kwarg) if p]


        def header_expressions(node):
            # The parts of a def, class or lambda that run in the enclosing
            # scope when it is defined: decorators, default values, and a
            # class's bases and keywords. Annotations are left out: they
            # are deferred under from __future__ import annotations and
            # evaluated lazily from Python 3.14 (PEP 649), so a call in one
            # is not reliably made.
            found = list(getattr(node, "decorator_list", []))
            if isinstance(node, ast.ClassDef):
                found += node.bases
                found += [keyword.value for keyword in node.keywords]
                return found
            spec = node.args
            found += spec.defaults
            found += [value for value in spec.kw_defaults if value is not None]
            return found


        def own_nodes(node, whole=None):
            # A node and everything beneath it in the same scope. A def or
            # class binds its name and runs its header here, but its body
            # is a scope of its own; a lambda runs only its defaults here.
            # A comprehension is a scope of its own too, scanned as a unit
            # where it appears (see scan_comprehension). Scanning also keeps
            # each node type in whole as a unit, to handle itself.
            whole = whole or COMPREHENSIONS
            if isinstance(node, SKIPPED_SCOPES):
                if not isinstance(node, ast.Lambda):
                    yield node
                for expression in header_expressions(node):
                    yield from own_nodes(expression, whole)
                return
            yield node
            if not isinstance(node, whole):
                yield from scope_nodes(node, whole)


        def scope_nodes(node, whole=None):
            children = ast.iter_child_nodes(node)
            if isinstance(node, ast.AnnAssign):
                # x: T = v evaluates v, but T is not reliably evaluated:
                # never for a local variable (PEP 526), and deferred or
                # lazy at module and class level, as for def annotations
                children = [node.target] + ([node.value] if node.value else [])
            for child in children:
                yield from own_nodes(child, whole)


        def expression_nodes(expression):
            # An expression and the nodes within it, for one scope, keeping
            # comprehensions and short-circuit and conditional expressions
            # whole, to be scanned as units
            return list(own_nodes(expression, SCANNED_UNITS))


        def body_nodes(scope):
            # The nodes of a def or class body, which is a scope of its
            # own; its header ran in the enclosing scope
            for statement in scope.body:
                yield from own_nodes(statement)


        FUNCTIONS = (ast.FunctionDef, ast.AsyncFunctionDef)
        BINDS_BY_NAME = (*FUNCTIONS, ast.ClassDef)
        COMPREHENSIONS = (
            ast.ListComp,
            ast.SetComp,
            ast.DictComp,
            ast.GeneratorExp,
        )
        # Pattern captures in a match statement (Python 3.10+ only)
        MATCH_CAPTURES = tuple(
            getattr(ast, kind)
            for kind in ("MatchAs", "MatchStar", "MatchMapping")
            if hasattr(ast, kind)
        )
        # Statements and expressions that bind names in their own scope;
        # a comprehension's loop variables are bound in its own scope
        NAME_BINDERS = (
            *BINDS_BY_NAME,
            ast.Assign,
            ast.AnnAssign,
            ast.AugAssign,
            ast.Delete,
            ast.For,
            ast.AsyncFor,
            ast.ExceptHandler,
            ast.NamedExpr,
            *MATCH_CAPTURES,
        )
        IMPORTS = (ast.Import, ast.ImportFrom)
        # Expressions whose later parts may not run: and/or and a chained
        # comparison stop early, and a conditional expression runs one
        # of its two branches
        SHORT_CIRCUITS = (ast.BoolOp, ast.IfExp, ast.Compare)
        # Expression nodes scanning keeps whole, to handle as units
        SCANNED_UNITS = (*COMPREHENSIONS, *SHORT_CIRCUITS)
        SCANNED = (*IMPORTS, ast.Call, *SCANNED_UNITS, *NAME_BINDERS)
        # Statements after which nothing else in their block runs
        TERMINATORS = (ast.Return, ast.Raise, ast.Break, ast.Continue)
        LOOPS = (ast.For, ast.AsyncFor, ast.While)
        BREAKS = (ast.Break,)
        LEAVES = (ast.Break, ast.Continue)
        # How surely code runs once its scope runs, weakest first: on a
        # path that may not run, after a statement that may have left the
        # block early, or certainly
        POSSIBLE, AFTER_EXIT, CERTAIN = 0, 1, 2
        # Calls that raise SystemExit, ending the program unless caught
        # (see EXIT_NAMES)
        EXIT_BUILTINS = ("exit", "quit")
        # The one part of each of these statements that runs whenever the
        # statement is reached (see evaluated_first)
        HEADER_FIELDS = {
            ast.If: "test",
            ast.While: "test",
            ast.Assert: "test",
            ast.For: "iter",
            ast.AsyncFor: "iter",
            ast.AnnAssign: "value",
        }


        def binds_by_name(node):
            return isinstance(node, BINDS_BY_NAME)


        def literal_name(call):
            for keyword in call.keywords:
                value = keyword.value
                if (
                    keyword.arg == "name"
                    and isinstance(value, ast.Constant)
                    and isinstance(value.value, str)
                ):
                    return value.value
            return ""


        def event_position(node):
            # When a node takes effect in straight-line code, in Python's
            # evaluation order. A call runs once its arguments are
            # evaluated, and an assignment, def or class binds after its
            # value or header, so both take effect where they end; a call
            # ending at the same place as a binding runs first
            # (setup = setup(...)).
            runs = isinstance(node, (ast.Call, *SCANNED_UNITS))
            return (node.end_lineno, node.end_col_offset, 0 if runs else 1)


        def scan_events(nodes, bindings):
            # Apply the calls and bindings of straight-line code (one simple
            # statement, or one expression) in evaluation order, updating
            # bindings in place. Return (found a packaging setup() call,
            # its literal name).
            ordered = sorted(
                (node for node in nodes if isinstance(node, SCANNED)),
                key=event_position,
            )
            found = False
            for node in ordered:
                if isinstance(node, IMPORTS):
                    bind_import(node, bindings)
                    continue
                if isinstance(node, COMPREHENSIONS):
                    hit, name = scan_comprehension(node, bindings)
                    found = found or hit
                    if name or HALTED:
                        return found or bool(name), name
                    continue
                if isinstance(node, SHORT_CIRCUITS):
                    hit, name = scan_short_circuit(node, bindings)
                    found = found or hit
                    if name or HALTED:
                        return found or bool(name), name
                    continue
                if isinstance(node, NAME_BINDERS):
                    if isinstance(node, ast.ClassDef) and not SETTLING:
                        run_class_body(node, bindings)
                    bind_definition(node, bindings)
                    continue
                deferred = id(node) in DEFERRED
                with Conditional() if deferred else contextlib.nullcontext():
                    hit, name = scan_call(node, bindings)
                found = found or hit
                if is_exit_call(node) and not deferred:
                    # Nothing evaluated after it in this expression runs
                    HALTED.append(True)
                    return found, ""
                if name:
                    return True, name
            return found, ""


        def scan_call(node, bindings):
            # Judge one call: record the functions it may reach, and
            # whether it is a packaging setup() call. Return (it is one,
            # its literal name if it certainly runs); one that may not
            # run is kept as a candidate instead (see find_setup).
            note_call(node.func, bindings)
            if SETTLING or not is_setup(node.func, bindings):
                return False, ""
            name = literal_name(node)
            level = path_level()
            if name and level < CERTAIN:
                CANDIDATES[-1].append((level, name))
                return True, ""
            return True, name


        def note_call(func, bindings):
            # Record each function a call by name may reach, against the
            # scope making the call, with how surely the call reaches it:
            # as surely as the call runs (path_level) when the name is
            # bound to that one function on every path, and otherwise only
            # possibly. An attribute call is not followed: what x.main()
            # reaches is not known from the name alone.
            if not isinstance(func, ast.Name):
                return
            sole = len(bindings.get(func.id, ())) == 1
            strength = path_level() if sole else POSSIBLE
            for kind in kinds(bindings, func.id):
                if isinstance(kind, tuple):
                    callees = CALLS.setdefault(SCOPE[-1], {})
                    callees[kind[1]] = max(callees.get(kind[1], 0), strength)


        def path_level():
            # How surely the code being scanned runs, once its scope runs:
            # CERTAIN, AFTER_EXIT when only an earlier statement that may
            # have left its block stands in the way, or POSSIBLE on a path
            # that may not run. A class body is no surer than the point
            # where its definition ran.
            if CONDITIONAL or SETTLING:
                return POSSIBLE
            level = AFTER_EXIT if EXITED else CERTAIN
            return min([level, *(outer for _, outer in CLASS_STACK)])


        def run_class_body(node, bindings):
            # A class body runs where its definition is reached, seeing
            # the bindings in force there, so scan it then and keep what
            # it finds. A call in it is made by the enclosing scope, and
            # is only as sure as the definition. A class scope does not
            # enclose the scopes nested in it, so a class defined inside
            # another sees what the outermost one started from.
            outer = path_level()
            start = CLASS_STACK[0][0] if CLASS_STACK else bindings
            CLASS_STACK.append((start, outer))
            try:
                found, name, level, _ = find_setup(node.body, start)
            finally:
                CLASS_STACK.pop()
            found_here = (SCOPE[-1], found, name, min(level, outer))
            CLASS_RUNS.setdefault(id(node), found_here)


        def scan_short_circuit(node, bindings):
            # The first operand of and/or, the first two of a chained
            # comparison, or the test of a conditional expression, always
            # run. Each later operand runs only if the ones before it did
            # not settle the result, and a conditional expression runs one
            # branch, so calls there are candidates and their bindings
            # (from :=) merge as ones that may not happen. Updates
            # bindings in place; returns (found, literal name).
            if isinstance(node, ast.IfExp):
                firsts, rest = [node.test], [node.body, node.orelse]
                chained = False
            elif isinstance(node, ast.Compare):
                firsts = [node.left, node.comparators[0]]
                rest, chained = node.comparators[1:], True
            else:
                firsts, rest, chained = node.values[:1], node.values[1:], True
            found, name = False, ""
            for first in firsts:
                hit, name = scan_events(expression_nodes(first), bindings)
                found = found or hit
                if name or HALTED:
                    return found or bool(name), name
            ends = [] if not chained else [dict(bindings)]
            current = dict(bindings)
            with Conditional():
                for part in rest:
                    # An and/or operand runs after the ones before it; a
                    # conditional expression's branches are alternatives
                    state = current if chained else dict(bindings)
                    hit, _ = scan_events(expression_nodes(part), state)
                    found = found or hit
                    ends.append(dict(state))
                    if HALTED:
                        # An exit here may not happen; when it does, no
                        # later operand of an and/or runs
                        HALTED.clear()
                        if chained:
                            break
            merged = merge(*ends)
            bindings.clear()
            bindings.update(merged)
            return found, ""


        def merge(*states):
            # The bindings where control flow paths meet: a name may refer
            # to anything it did on any path, or be unbound on a path that
            # never bound it
            unbound = frozenset({UNBOUND})
            names = {name for state in states for name in state}
            merged = {}
            for name in names:
                options = [state.get(name, unbound) for state in states]
                merged[name] = frozenset().union(*options)
            return merged


        def ast_types(*names):
            # The named AST node types this Python version has
            return tuple(getattr(ast, n) for n in names if hasattr(ast, n))


        # Compound statements that only some Python versions have
        TRY_STATEMENTS = ast_types("Try", "TryStar")
        MATCH_STATEMENTS = ast_types("Match")
        # Enough passes for a loop's bindings to settle: each pass can only
        # add kinds to a name, and there are few kinds
        LOOP_LIMIT = 8
        # Non-empty while a loop's bindings settle, when calls are not yet
        # judged
        SETTLING = []
        # Non-empty while scanning a path that may not run (an if branch,
        # an except handler, a match case, a loop or comprehension body).
        # A packaging call found there is only a candidate: a call that
        # certainly runs is preferred, so a dead branch cannot supply the
        # name ahead of the real call.
        CONDITIONAL = []
        # One list per scope being scanned, holding its candidates in
        # evaluation order
        CANDIDATES = []
        # The scope whose code is being scanned: None for module level,
        # or a function's id; code in a class body belongs to the scope
        # that defines the class. A scope that is never reached uses
        # NEVER, so the calls it makes reach nothing.
        NEVER = "never"
        SCOPE = [None]
        # The functions each scope may call, by id, each with how surely
        # a call to it runs there (see path_level)
        CALLS = {}
        # One entry per class body being scanned, outermost first: the
        # bindings where the outermost class was defined, and how surely
        # that definition ran
        CLASS_STACK = []
        # Non-empty after an exit call (see is_exit_call) in code that
        # always runs: nothing evaluated after it in the statement runs,
        # and its block ends there
        HALTED = []
        # Non-empty after a statement that may have left its block early,
        # for the rest of that block
        EXITED = []
        # What each class body found when it ran: (its scope,
        # found a packaging call, its literal name, certainly runs)
        CLASS_RUNS = {}


        class Conditional:
            # Mark the code scanned inside it as a path that may not run
            def __enter__(self):
                CONDITIONAL.append(True)

            def __exit__(self, *exc):
                CONDITIONAL.pop()


        def run_block(statements, bindings):
            # Run a block of statements from the given bindings, following
            # control flow, and stop after one that ends the block (see
            # ends_block): nothing after it in the block runs. Once a
            # compound statement may have left the block early, the rest
            # of it runs only AFTER_EXIT (see path_level). Return (found
            # a packaging setup() call, its literal name, the bindings
            # after the block).
            found, doubtful = False, False
            try:
                for statement in statements:
                    hit, name, bindings = run_statement(statement, bindings)
                    found = found or hit
                    if name:
                        return True, name, bindings
                    if HALTED:
                        # The statement exited part-way (see scan_events)
                        HALTED.clear()
                        break
                    if ends_block(statement):
                        break
                    if not doubtful and may_exit(statement):
                        EXITED.append(True)
                        doubtful = True
            finally:
                if doubtful:
                    EXITED.pop()
            return found, "", bindings


        def ends_block(statement):
            # Whether nothing after this statement in its block runs
            if isinstance(statement, TERMINATORS):
                return True
            return raised(statement) is not None


        def raised(statement):
            # The exception a statement certainly raises, as a dotted name
            # ("" when it cannot be told), or None when it need not raise.
            # An exit call among the parts of it that always run (see
            # always_evaluated) comes first: raise KeyError(sys.exit())
            # raises SystemExit. Then a raise, or an assert on a false
            # constant.
            for part in evaluated_first(statement):
                for node in always_evaluated(part):
                    if is_exit_call(node):
                        return "SystemExit"
            return raises_here(statement)


        def raises_here(node):
            # The exception this node itself raises when it runs: a raise,
            # an assert on a false constant, or an exit call
            if isinstance(node, ast.Raise):
                exc = node.exc
                exc = exc.func if isinstance(exc, ast.Call) else exc
                return dotted(exc) if exc is not None else ""
            if fails_assert(node):
                return "AssertionError"
            return "SystemExit" if is_exit_call(node) else None


        def fails_assert(node):
            # An assert whose test is a false constant, which always fails
            test = getattr(node, "test", None)
            is_assert = isinstance(node, ast.Assert) and is_constant(test)
            return is_assert and not test.value


        def is_exit_call(node):
            # A call to sys.exit(), exit() or quit(), however the file
            # names it (see EXIT_NAMES)
            is_call = isinstance(node, ast.Call)
            return is_call and dotted(node.func) in EXIT_NAMES


        def is_constant(node):
            return isinstance(node, ast.Constant)


        def evaluated_first(statement):
            # The parts of a statement that run whenever it is reached: a
            # compound statement's header, an assert's test (and its
            # message when the test is a false constant, as it then always
            # runs), an annotated assignment's value (its annotation is not
            # reliably evaluated), or all of any other simple statement
            if isinstance(statement, (ast.With, ast.AsyncWith)):
                return [item.context_expr for item in statement.items]
            if isinstance(statement, MATCH_STATEMENTS):
                return [statement.subject]
            if fails_assert(statement) and statement.msg:
                return [statement.test, statement.msg]
            field = HEADER_FIELDS.get(type(statement))
            if field:
                return [part for part in [getattr(statement, field)] if part]
            if compound_runner(statement) is not None:
                return []
            return [statement]


        def always_evaluated(node):
            # A node and the nodes beneath it that run whenever it does:
            # only the first operand of and/or, the test of a conditional
            # expression, the first two operands of a chained comparison,
            # the first iterable of a comprehension, and the header of a
            # def or lambda. A class body runs where it is defined, so its
            # statements count too.
            yield node
            if isinstance(node, ast.BoolOp):
                children = node.values[:1]
            elif isinstance(node, ast.IfExp):
                children = [node.test]
            elif isinstance(node, ast.Compare):
                children = [node.left, node.comparators[0]]
            elif isinstance(node, COMPREHENSIONS):
                children = [node.generators[0].iter]
            elif isinstance(node, ast.ClassDef):
                body = [p for s in node.body for p in evaluated_first(s)]
                children = header_expressions(node) + body
            elif isinstance(node, SKIPPED_SCOPES):
                children = header_expressions(node)
            else:
                children = ast.iter_child_nodes(node)
            for child in children:
                yield from always_evaluated(child)


        def escapes(exception, handlers):
            # Whether a raised exception (None for none) gets past every
            # enclosing try's handlers
            if exception is None:
                return False
            return not any(catches(h, exception) for h in handlers)


        def catches(handlers, exception):
            # Whether one of a try's handlers catches the named exception
            # (see handles); a bare except catches anything
            for handler in handlers:
                if handler.type is None:
                    return True
                types = handler.type
                types = types.elts if isinstance(types, ast.Tuple) else [types]
                if any(handles(dotted(t), exception) for t in types):
                    return True
            return False


        def handles(caught, exception):
            # Whether `except caught` catches the named exception. A class
            # this file defines is followed through its bases, and the
            # built-in classes reached follow Python's own hierarchy, so
            # except LookupError catches KeyError and except Exception does
            # not catch SystemExit. An exception that cannot be told (a
            # bare re-raise, a variable, an imported class) is caught only
            # by its own name or BaseException.
            if caught == "BaseException":
                return True
            lineage = exception_lineage(exception)
            if caught in lineage:
                return True
            handler = builtin_exception(caught)
            if handler is None:
                return False
            known = [c for c in map(builtin_exception, lineage) if c]
            return any(issubclass(c, handler) for c in known)


        def exception_lineage(name):
            # An exception's name and those of its bases, through the
            # classes this file defines. A class defined more than once
            # cannot be told apart here, so its name is followed no
            # further.
            lineage, todo = set(), [name] if name else []
            while todo:
                current = todo.pop()
                if current not in lineage:
                    lineage.add(current)
                    todo.extend(CLASS_BASES.get(current) or ())
            return lineage


        def builtin_exception(name):
            # The built-in exception class with this name, if there is one
            # and nothing in the file binds the name itself (an import,
            # assignment, def or class may shadow it)
            if not name or name in ORIGINS:
                return None
            found = getattr(builtins, name, None)
            if isinstance(found, type) and issubclass(found, BaseException):
                return found
            return None


        def may_exit(node, *, in_loop=False, handlers=(), leaves=LEAVES):
            # Whether a statement may end its enclosing block early: a
            # return in this scope, a statement that raises (see raised)
            # unless a try around it here catches the exception, or a
            # break or continue (those in leaves) that belongs to a loop
            # around the block. One in the body of a loop nested in the
            # statement only leaves that loop; one in such a loop's else
            # clause still leaves the enclosing one. handlers holds the
            # handler lists of the try statements whose bodies enclose
            # the node.
            if isinstance(node, ast.Return):
                return True
            if escapes(raises_here(node), handlers):
                return True
            if isinstance(node, (ast.Break, ast.Continue)):
                return not in_loop and isinstance(node, leaves)
            if isinstance(node, SKIPPED_SCOPES):
                # Only the header runs here (see header_expressions), and
                # a class body, which runs where it is defined
                parts = header_expressions(node)
                if isinstance(node, ast.ClassDef):
                    parts = parts + node.body
                nested = {"handlers": handlers, "leaves": leaves}
                return any(may_exit(part, **nested) for part in parts)
            loop_body = node.body if isinstance(node, LOOPS) else []
            guarded = isinstance(node, TRY_STATEMENTS) and node.handlers
            guarded_body = node.body if guarded else []
            inner = (*handlers, node.handlers) if guarded else handlers
            return any(
                may_exit(
                    child,
                    in_loop=in_loop or child in loop_body,
                    handlers=inner if child in guarded_body else handlers,
                    leaves=leaves,
                )
                for child in ast.iter_child_nodes(node)
            )


        def run_loop(body, bindings, target):
            # A loop body may run any number of times, so a call in it
            # counts only if it holds on every pass. First settle the
            # bindings at the body's start (no passes, or any number)
            # without judging calls, then run the body once from there.
            # The state after the loop is that settled state.
            def one_pass(entry):
                state = dict(entry)
                for name in target_names(target) if target else []:
                    bind(state, name, "other")
                return run_block(body, state)

            entry = bindings
            if SETTLING:
                # Inside an outer loop that is still settling: one pass
                # here is enough, since the outer loop repeats this one,
                # and it keeps nested loops from multiplying passes
                return False, "", merge(entry, one_pass(entry)[2])
            SETTLING.append(True)
            try:
                for _ in range(LOOP_LIMIT):
                    widened = merge(entry, one_pass(entry)[2])
                    if widened == entry:
                        break
                    entry = widened
            finally:
                SETTLING.pop()
            # The body may run no times at all
            with Conditional():
                found, name, _ = one_pass(entry)
            return found, name, entry


        def run_try(node, state):
            # The body may raise at any point, so a handler starts from
            # what held before or after it; else runs after the body only
            # if nothing in it raised, which cannot be known here, and
            # finally runs after every path
            found, name, after_body = run_block(node.body, state)
            if name:
                return True, name, after_body
            raised = merge(state, after_body)
            with Conditional():
                hit, name, after_else = run_block(node.orelse, after_body)
            found = found or hit
            if name:
                return True, name, after_else
            ends = [after_else]
            for handler in node.handlers:
                handler_state = dict(raised)
                # A handler runs only if the body raises
                with Conditional():
                    hit, name, handler_end = run_handler(handler, handler_state)
                found = found or hit
                if name:
                    return True, name, handler_end
                ends.append(handler_end)
            hit, name, after = run_block(node.finalbody, merge(*ends))
            return found or hit, name, after


        def run_handler(handler, state):
            # Run one except clause: its type, then its body with any
            # `as` name bound, which Python unbinds again at its end
            found = False
            if handler.type is not None:
                hit, name = scan_events(expression_nodes(handler.type), state)
                found = found or hit
                if name or HALTED:
                    HALTED.clear()
                    return found or bool(name), name, state
            if handler.name:
                bind(state, handler.name, "other")
            hit, name, end = run_block(handler.body, state)
            if handler.name:
                end = dict(end)
                end[handler.name] = frozenset({UNBOUND})
            return found or hit, name, end


        def run_match(node, state):
            # Each case starts from the state before the match, binding its
            # pattern's captures; when no case matches, nothing is bound
            found, name = scan_events(expression_nodes(node.subject), state)
            if name or HALTED:
                return found or bool(name), name, state
            ends = [state]
            for case in node.cases:
                # A case runs only if its pattern matches
                with Conditional():
                    hit, name, case_end = run_case(case, dict(state))
                found = found or hit
                if name:
                    return True, name, case_end
                ends.append(case_end)
            return found, "", merge(*ends)


        def run_case(case, state):
            # Run one match case: its pattern's captures and guard, then
            # its body
            found = False
            parts = [case.pattern] + ([case.guard] if case.guard else [])
            for part in parts:
                hit, name = scan_events(expression_nodes(part), state)
                found = found or hit
                if name or HALTED:
                    HALTED.clear()
                    return found or bool(name), name, state
            hit, name, end = run_block(case.body, state)
            return found or hit, name, end


        def run_branches(test, branches, state):
            # Evaluate a test, then run each alternative branch from the
            # resulting state and merge where they meet
            found, name = scan_events(expression_nodes(test), state)
            if name or HALTED:
                return found or bool(name), name, state
            ends = []
            for branch in branches:
                # Each branch runs only if the test selects it
                with Conditional():
                    hit, name, end = run_block(branch, state)
                found = found or hit
                if name:
                    return True, name, end
                ends.append(end)
            return found, "", merge(*ends)


        def run_loop_statement(node, state):
            # Evaluate a loop's iterable or test, run the body any number
            # of times, then its else clause
            is_for = not isinstance(node, ast.While)
            head = node.iter if is_for else node.test
            found, name = scan_events(expression_nodes(head), state)
            if name or HALTED:
                return found or bool(name), name, state
            target = node.target if is_for else None
            hit, name, after = run_loop(node.body, state, target)
            if name:
                return True, name, after
            # The else clause runs only if the body did not leave the loop
            # by break, return or raise; a continue does not skip it
            skips_else = any(may_exit(s, leaves=BREAKS) for s in node.body)
            with Conditional() if skips_else else contextlib.nullcontext():
                more, name, after = run_block(node.orelse, after)
            return found or hit or more, name, after


        def run_with(node, state):
            # Each item binds its target before the next item runs; the
            # body always runs
            found = False
            for item in node.items:
                context = expression_nodes(item.context_expr)
                hit, name = scan_events(context, state)
                found = found or hit
                if name or HALTED:
                    return found or bool(name), name, state
                for target in target_names(item.optional_vars):
                    bind(state, target, "other")
            hit, name, state = run_block(node.body, state)
            return found or hit, name, state


        def run_if(node, state):
            return run_branches(node.test, [node.body, node.orelse], state)


        def compound_runner(node):
            # The handler for a compound statement, or None for a simple
            # statement run as straight-line code
            runners = (
                (ast.If, run_if),
                ((ast.For, ast.AsyncFor, ast.While), run_loop_statement),
                ((ast.With, ast.AsyncWith), run_with),
                (TRY_STATEMENTS, run_try),
                (MATCH_STATEMENTS, run_match),
            )
            for kinds_of_node, runner in runners:
                if kinds_of_node and isinstance(node, kinds_of_node):
                    return runner
            return None


        def run_statement(node, bindings):
            # Run one statement. Branches start from the same state and
            # merge where they meet, so a binding on a path that may not run
            # (an if, a loop body, an except handler, a match case) makes a
            # name ambiguous rather than replacing it. Return (found a
            # packaging setup() call, its literal name, the bindings after).
            state = dict(bindings)
            runner = compound_runner(node)
            if runner:
                return runner(node, state)
            found, name = scan_events(own_nodes(node, SCANNED_UNITS), state)
            return found, name, state


        def scan_comprehension(node, enclosing):
            # The first iterable runs in the enclosing scope. Each target
            # then binds in the comprehension's own scope, before its
            # conditions, any later iterables and the element run, in that
            # order and sharing one set of bindings, so an assignment
            # expression in a condition is seen by the element. Such an
            # assignment also binds in the enclosing scope (PEP 572); the
            # language forbids one in a comprehension's iterable.
            inner = dict(enclosing)
            parts = []
            for index, generator in enumerate(node.generators):
                parts.append((generator.iter, index == 0))
                parts.append((generator.target, None))
                parts.extend((condition, False) for condition in generator.ifs)
            if isinstance(node, ast.DictComp):
                parts += [(node.key, False), (node.value, False)]
            else:
                parts.append((node.elt, False))
            found = False
            for index, (part, runs_outside) in enumerate(parts):
                if runs_outside is None:
                    for name in target_names(part):
                        bind(inner, name, "other")
                    continue
                scope = dict(enclosing) if runs_outside else inner
                # Everything after the first iterable runs once per item,
                # which may be no times at all
                if index == 0:
                    hit, name = scan_events(expression_nodes(part), scope)
                else:
                    with Conditional():
                        hit, name = scan_events(expression_nodes(part), scope)
                found = found or hit
                if name:
                    return True, name
                if HALTED and index == 0:
                    return found, ""
                if HALTED:
                    # An exit per item may not happen: there may be none
                    HALTED.clear()
                    break
            for walrus in comprehension_walruses(node):
                bind_definition(walrus, enclosing)
            return found, ""


        def find_setup(statements, bindings):
            # Run one scope's statements, starting from the bindings it
            # inherits. Return (found a packaging setup() call, its
            # literal name, how surely that call runs within the scope
            # (see path_level), the scope's bindings at the end). The first
            # call that certainly runs wins; otherwise the surest of the
            # others, the earliest among equals.
            CANDIDATES.append([])
            saved = list(CONDITIONAL), list(EXITED), list(HALTED)
            CONDITIONAL.clear()
            EXITED.clear()
            HALTED.clear()
            try:
                found, name, end = run_block(statements, dict(bindings))
                candidates = CANDIDATES[-1]
            finally:
                CANDIDATES.pop()
                CONDITIONAL[:], EXITED[:], HALTED[:] = saved
            if name:
                return True, name, CERTAIN, end
            if candidates:
                level, name = max(candidates, key=lambda c: c[0])
                return True, name, level, end
            return found, "", POSSIBLE, end


        def parameters(function):
            # Every parameter name of a def, which is local to its body
            return [param.arg for param in parameter_nodes(function.args)]


        def comprehension_walruses(node):
            # The assignment expressions a comprehension makes in its own
            # scope, including in nested comprehensions, all of which bind
            # in the enclosing scope (PEP 572). A lambda body is a scope of
            # its own, so only its defaults are searched.
            for child in ast.iter_child_nodes(node):
                if isinstance(child, ast.Lambda):
                    for default in header_expressions(child):
                        if isinstance(default, ast.NamedExpr):
                            yield default
                        yield from comprehension_walruses(default)
                    continue
                if isinstance(child, ast.NamedExpr):
                    yield child
                yield from comprehension_walruses(child)


        def imported_names(node):
            # The local names an import statement binds
            names = []
            for alias in node.names:
                if alias.asname:
                    names.append(alias.asname)
                elif isinstance(node, ast.Import):
                    names.append(alias.name.split(".")[0])
                elif alias.name != "*":
                    names.append(alias.name)
            return names


        def function_locals(function):
            # Python decides a function's local names before it runs: any
            # name bound anywhere in its body is local throughout, so using
            # one before it is bound fails (UnboundLocalError) rather than
            # reaching an outer setup. Names declared global or nonlocal
            # are not local.
            local, declared = set(), set()
            for node in body_nodes(function):
                if isinstance(node, (ast.Global, ast.Nonlocal)):
                    declared.update(node.names)
                elif isinstance(node, (ast.With, ast.AsyncWith)):
                    for item in node.items:
                        if item.optional_vars is not None:
                            local.update(target_names(item.optional_vars))
                elif isinstance(node, IMPORTS):
                    local.update(imported_names(node))
                elif isinstance(node, COMPREHENSIONS):
                    for walrus in comprehension_walruses(node):
                        local.update(bound_names(walrus))
                elif isinstance(node, ast.AnnAssign):
                    # x: T makes x local even with no value, like any
                    # binding; (x): T and x.attr: T do not
                    if node.simple and isinstance(node.target, ast.Name):
                        local.add(node.target.id)
                elif isinstance(node, NAME_BINDERS):
                    local.update(bound_names(node))
            return local - declared


        def search_scopes(scope, inherited, results):
            # Scan each function and class defined in this scope, then the
            # ones nested in them, in source order, adding what each finds
            # to results as (the scope it runs in, how surely the call runs
            # within it, name). Each
            # starts from what it inherits, so a name bound in one function
            # never leaks into another. A function sees its enclosing
            # scope's bindings, with every name it binds anywhere,
            # parameters included, local from the start; a class body's own
            # names are not visible inside its methods. A class body was
            # scanned where its definition ran; one never reached runs in
            # no scope.
            nested = filter(binds_by_name, scope_nodes(scope))
            for child in sorted(nested, key=lambda n: (n.lineno, n.col_offset)):
                if isinstance(child, ast.ClassDef):
                    ran = CLASS_RUNS.get(id(child))
                    if ran is None:
                        ran = (NEVER, *scan_scope(child, inherited, NEVER))
                    key, found, name, level = ran[:4]
                    end = inherited
                else:
                    start = dict(inherited)
                    for name in function_locals(child):
                        bind(start, name, UNBOUND)
                    for param in parameters(child):
                        bind(start, param, "other")
                    key = id(child)
                    found, name, level, end = scan_scope(child, start, key)
                if found:
                    results.append((key, level, name))
                search_scopes(child, end, results)


        def scan_scope(child, start, key):
            # Scan a def or class body as the given scope
            SCOPE.append(key)
            try:
                return find_setup(child.body, start)
            finally:
                SCOPE.pop()


        def reached_scopes():
            # How surely each scope runs: module level always does, and a
            # function as surely as the best path of calls to it allows,
            # each call counting as surely as it runs (see path_level).
            # Levels are a call's level plus one, so 0 means never.
            level, todo = {None: CERTAIN + 1}, [None]
            while todo:
                caller = todo.pop()
                for callee, strength in CALLS.get(caller, {}).items():
                    reach = min(level[caller], strength + 1)
                    if reach > level.get(callee, 0):
                        level[callee] = reach
                        todo.append(callee)
            return level


        def best_result(results, reached):
            # Prefer the call the file most surely reaches: by how surely
            # its scope runs, then by how surely the call runs within it,
            # then the earliest
            ranked = [(reached.get(k, 0), lvl, n) for k, lvl, n in results]
            ranked = [entry for entry in ranked if entry[2]]
            if ranked:
                return True, max(ranked, key=lambda r: r[:2])[2]
            return bool(results), ""


        def calls_setup(nodes):
            # Whether a bare setup() is called here, packaging or not; a
            # call such as helper.setup() says nothing about where the
            # project's setup() lives
            return any(
                isinstance(node, ast.Call)
                and isinstance(node.func, ast.Name)
                and node.func.id == "setup"
                for node in nodes
            )


        # Prefer a setup() call made at module level. Only when module
        # level calls no bare setup() (e.g. setup() inside a main() the
        # file calls) look in function and class bodies too: a function
        # with its own bindings on top of the module's final ones, a
        # class body as it ran. A module-level setup() that is not a
        # packaging one stays rejected.
        # The bases each class this file defines names, by class name,
        # to match raised exceptions against handlers (see handles);
        # None for a name defined more than once. DEFERRED holds the
        # ids of the nodes in an assert's message, which runs only when
        # the assert fails.
        CLASS_BASES, DEFERRED = {}, set()


        def index_classes(node, prefix=""):
            # Record each class's bases under the name code reaches it by:
            # Outer.Inner for one nested in a class body, its own name
            # otherwise. A name defined more than once maps to None.
            for child in ast.iter_child_nodes(node):
                inner = "" if isinstance(child, FUNCTIONS) else prefix
                if isinstance(child, ast.ClassDef):
                    name = prefix + child.name
                    bases = list(filter(None, map(dotted, child.bases)))
                    repeated = name in CLASS_BASES
                    CLASS_BASES[name] = None if repeated else bases
                    inner = name + "."
                index_classes(child, inner)


        index_classes(tree)


        def binding_origins(root):
            # How the file binds each name, anywhere in it: ("module", m)
            # for import m, ("from", m, x) for from m import x, and OTHER
            # for anything else (an assignment, def, class, parameter,
            # handler or match capture). A star import is not followed.
            origins = {}
            for node in ast.walk(root):
                for name, origin in origins_of(node):
                    origins.setdefault(name, set()).add(origin)
            return origins


        def origins_of(node):
            # The (name, origin) pairs one node binds (see binding_origins)
            if isinstance(node, ast.Import):
                for alias in node.names:
                    root = alias.name.split(".")[0]
                    module = alias.name if alias.asname else root
                    yield alias.asname or root, ("module", module)
            elif isinstance(node, ast.ImportFrom):
                for alias in node.names:
                    if alias.name != "*":
                        local = alias.asname or alias.name
                        yield local, ("from", node.module, alias.name)
            elif isinstance(node, ast.Name):
                if not isinstance(node.ctx, ast.Load):
                    yield node.id, OTHER
            elif isinstance(node, ast.arg):
                yield node.arg, OTHER
            elif isinstance(node, NAMED_BINDERS):
                for name in bound_names(node):
                    yield name, OTHER


        # Every name the file binds, with how (see binding_origins), and
        # the names a call to sys.exit(), exit() or quit() goes by here:
        # exit and quit while nothing in the file binds them, and those
        # bound only by import sys [as s] or from sys import exit [as e]
        OTHER = ("other",)
        # Nodes that bind a name of their own: a def, class, except ... as
        # or match capture
        NAMED_BINDERS = (*BINDS_BY_NAME, ast.ExceptHandler, *MATCH_CAPTURES)
        ORIGINS = binding_origins(tree)
        EXIT_NAMES = {name for name in EXIT_BUILTINS if name not in ORIGINS}
        for local, ways in ORIGINS.items():
            if ways == {("module", "sys")}:
                EXIT_NAMES.add(f"{local}.exit")
            if ways == {("from", "sys", "exit")}:
                EXIT_NAMES.add(local)
        for definition in ast.walk(tree):
            # An assert's message runs only when it fails; a false
            # constant test always does (see evaluated_first)
            message = getattr(definition, "msg", None)
            failing = fails_assert(definition)
            if isinstance(definition, ast.Assert) and message and not failing:
                DEFERRED.update(map(id, ast.walk(message)))
        found_call, name, _, module_bindings = find_setup(tree.body, {})
        if not found_call and not calls_setup(scope_nodes(tree)):
            results = []
            search_scopes(tree, module_bindings, results)
            found_call, name = best_result(results, reached_scopes())
        # Without a recognised setup() call, report it rather than guess
        # from another call's name= argument.
        if not found_call:
            print("No packaging setup() call in setup.py", file=sys.stderr)
        elif not name:
            print("setup() in setup.py has no literal name", file=sys.stderr)
        if name and not re.fullmatch(sys.argv[2], name):
            print(
                f"Rejecting non-PEP-508 name from setup.py: {name!r}",
                file=sys.stderr,
            )
            name = ""
        print(name)
        PY
          ); then
          parsed="true"
        fi
        # Without a usable Python, or when setup.py does not parse
        # (e.g. Python 2 syntax), fall back to the first quoted
        # `name=` whose `name` is not the tail of a longer identifier.
        # Python rejects raw NUL bytes in source, and some awk
        # implementations pass them through for command substitution
        # to drop, so skip the fallback for any file that holds one.
        if [ "$parsed" != "true" ] && \
          [ "$(tr -d '\000' < "$setup_py" | wc -c)" -ne \
            "$(wc -c < "$setup_py")" ]; then
          echo "Ignoring setup.py: it contains NUL bytes ⚠️"
          name=""
        elif [ "$parsed" != "true" ]; then
          echo "Parsing setup.py without the Python ast module ⚠️"
          name=$(awk -v sq="'" -v dq='"' '
            /^[[:space:]]*#/ { next }
            {
              line=" " $0
              pattern="[^A-Za-z0-9_]name[[:space:]]*=[[:space:]]*"
              while (match(line, pattern)) {
                line=substr(line, RSTART + RLENGTH)
                quote=substr(line, 1, 1)
                if (quote != sq && quote != dq) continue
                value=substr(line, 2)
                end=index(value, quote)
                if (end > 1) {
                  print substr(value, 1, end - 1)
                  exit
                }
              }
            }
          ' "$setup_py")
        fi
        # Check again here, for the fallback's result.
        if [[ ! "$name" =~ $pep508 ]]; then
          if [ -n "$name" ]; then
            printf 'Rejecting non-PEP-508 name from setup.py: %q ⚠️\n' "$name"
          fi
          name=""
        fi
        delim="EOF_${RANDOM}_${RANDOM}_$$"
        {
          echo "extracted_string<<$delim"
          printf '%s\n' "$name"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$name" ]; then
          echo "Found name in setup.py: $name 💬"
        else
          echo "No project name found in setup.py ⚠️"
        fi

    - name: "Capture Python project metadata"
      id: capture
      shell: bash
      env:
        # Pass step outputs in via the environment rather than
        # interpolating them directly into the script body. This
        # avoids any chance of repo-controlled values (notably the
        # setup.cfg-derived name) breaking out of shell quoting in
        # this step.
        PYPROJECT_NAME: ${{ steps.pyproject-name.outputs.extracted_string }}
        SETUP_CFG_TYPE: ${{ steps.setup-cfg.outputs.type }}
        SETUP_CFG_NAME: ${{ steps.setup-cfg-name.outputs.extracted_string }}
        SETUP_PY_TYPE: ${{ steps.setup-py.outputs.type }}
        SETUP_PY_NAME: ${{ steps.setup-name.outputs.extracted_string }}
      # yamllint disable rule:line-length
      run: |
        # Capture Python project metadata

        # pyproject.toml is the preferred source, but only when it
        # actually yielded a [project] name. A [build-system]-only file
        # leaves PYPROJECT_NAME empty and must fall through to setup.cfg.
        if [ -n "$PYPROJECT_NAME" ]; then
          PYTHON_PROJECT_NAME="$PYPROJECT_NAME"
          PYTHON_PROJECT_FILE="pyproject.toml"
          SOURCE="pyproject.toml"
          echo "Using project name from: pyproject.toml ✅"

        # Fall back to setup.cfg [metadata] (pbr / legacy setuptools)
        elif [ "$SETUP_CFG_TYPE" = 'file' ] && \
             [ -n "$SETUP_CFG_NAME" ]; then
          PYTHON_PROJECT_NAME="$SETUP_CFG_NAME"
          PYTHON_PROJECT_FILE="setup.cfg"
          SOURCE="setup.cfg"
          echo "Using project name from: setup.cfg ⚠️"

        # Fall back to setup.py if neither of the above
        elif [ "$SETUP_PY_TYPE" = 'file' ]; then
          PYTHON_PROJECT_NAME="$SETUP_PY_NAME"
          PYTHON_PROJECT_FILE="setup.py"
          SOURCE="setup.py"
          echo "Using project name from: setup.py ⚠️"
        else
          echo "Error: no project name found in pyproject.toml," \
            "setup.cfg or setup.py ❌"
          exit 1
        fi

        if [ -z "$PYTHON_PROJECT_NAME" ]; then
          echo "Python project name extraction failed ❌"
          exit 1
        fi
        echo "Python project name: $PYTHON_PROJECT_NAME 💬"

        # Replace all dashes in the name with underscores
        PYTHON_PACKAGE_NAME=$(echo "$PYTHON_PROJECT_NAME" | tr '-' '_')
        echo "Python package name: $PYTHON_PACKAGE_NAME"

        # Make available as step outputs (the documented contract)
        echo "python_project_name=$PYTHON_PROJECT_NAME" >> "$GITHUB_OUTPUT"
        echo "python_package_name=$PYTHON_PACKAGE_NAME" >> "$GITHUB_OUTPUT"
        echo "python_project_file=$PYTHON_PROJECT_FILE" >> "$GITHUB_OUTPUT"
        echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
