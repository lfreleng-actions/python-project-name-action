          RESULT_63: "${{ steps.f63.outcome }}|${{ steps.f63.outputs.python_project_name }}|${{ steps.f63.outputs.python_package_name }}|${{ steps.f63.outputs.source }}|${{ steps.f63.outputs.python_project_file }}"
          RESULT_64: "${{ steps.f64.outcome }}|${{ steps.f64.outputs.python_project_name }}|${{ steps.f64.outputs.python_package_name }}|${{ steps.f64.outputs.source }}|${{ steps.f64.outputs.python_project_file }}"
          MODE: ${{ matrix.mode.id }}
        # yamllint enable rule:line-length
        run: |
          # Validate every fixture, reporting all failures before exiting
          failures=0
          for dir in f/*/; do
            nn=$(basename "$dir")
            case_name=$(cat "$dir/case")
            expect=$(cat "$dir/expect")
            source=$(cat "$dir/file")
            if [[ " $(cat "$dir/skip") " == *" $MODE "* ]]; then
              echo "⏭️  $nn $case_name: not asserted in $MODE mode"
              continue
            fi
            var="RESULT_$nn"
            if [ -z "${!var+set}" ]; then
              echo "❌ $nn $case_name: no result recorded"
              failures=$((failures + 1))
              continue
            fi
            IFS="|" read -r outcome name package got_source got_file \
              <<< "${!var}"
            errors=()
            if [ -z "$expect" ]; then
              # The action must fail rather than emit a name the shell
              # altered (e.g. "foo<NUL>bar" becoming "foobar")
              [ "$outcome" = "failure" ] ||
                errors+=("expected failure, outcome: $outcome")
              [ -z "$name" ] || errors+=("unexpected name: $name")
            else
              [ "$outcome" = "success" ] || errors+=("outcome: $outcome")
              [ "$name" = "$expect" ] || errors+=("python_project_name: $name")
              [ "$package" = "${expect//-/_}" ] ||
                errors+=("python_package_name: $package")
              [ "$got_source" = "$source" ] || errors+=("source: $got_source")
              [ "$got_file" = "$source" ] ||
                errors+=("python_project_file: $got_file")
            fi
            if [ "${#errors[@]}" -eq 0 ]; then
              echo "✅ $nn $case_name"
            else
              echo "❌ $nn $case_name: ${errors[*]}"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures fixture(s) failed ❌"
            exit 1
          fi
          echo "All fixtures passed ✅"
