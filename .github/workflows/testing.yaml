---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Action Testing"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      # Perform setup prior to running test(s)
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"
          persist-credentials: false

      - name: "Run Action: ${{ github.repository }} [test-python-project]"
        id: test-pyproject-toml
        uses: $/
        with:
          path_prefix: "test-python-project/"

      # yamllint disable rule:line-length

      - name: "Validate Action Output: ${{ github.repository }} [test-python-project]"
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.test-pyproject-toml.outputs.python_project_file }}
          PROJECT_NAME: ${{ steps.test-pyproject-toml.outputs.python_project_name }}
          PACKAGE_NAME: ${{ steps.test-pyproject-toml.outputs.python_package_name }}
          SOURCE: ${{ steps.test-pyproject-toml.outputs.source }}
        run: |
          # Validate Action Output
          ERROR=""
          project_file="$PROJECT_FILE"
          if [ "$project_file" != "pyproject.toml" ]; then
            echo "Unexpected return value for: python_project_file ❌"
            echo "Returned: $project_file"
            echo "Expected: pyproject.toml"
            ERROR="true"
          fi
          project_name="$PROJECT_NAME"
          if [ "$project_name" != "lfreleng-test-python-project" ]; then
            echo "Unexpected return value for: python_project_name ❌"
            echo "Returned: $project_name"
            echo "Expected: lfreleng-test-python-project"
            ERROR="true"
          fi
          package_name="$PACKAGE_NAME"
          if [ "$package_name" != "lfreleng_test_python_project" ]; then
            echo "Unexpected return value for: python_package_name ❌"
            echo "Returned: $package_name"
            echo "Expected: lfreleng_test_python_project"
            ERROR="true"
          fi
          source="$SOURCE"
          if [ "$source" != "pyproject.toml" ]; then
            echo "Unexpected return value for: source ❌"
            echo "Returned: $source"
            echo "Expected: pyproject.toml"
            ERROR="true"
          fi
          if [ "$ERROR" != "true" ]; then
            echo "All output tests passed for test-python-project ✅"
          else
            echo "At least one output test failed for test-python-project ❌"
            exit 1
          fi

      # Second test with python-nss-ng project
      - name: "Checkout python-nss-ng project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "ModeSevenIndustrialSolutions/python-nss-ng"
          path: "python-nss-ng"
          persist-credentials: false

      - name: "Run Action: ${{ github.repository }} [python-nss-ng]"
        id: test-python-nss-ng
        uses: $/
        with:
          path_prefix: "python-nss-ng/"

      - name: "Validate Action Output: ${{ github.repository }} [python-nss-ng]"
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.test-python-nss-ng.outputs.python_project_file }}
          PROJECT_NAME: ${{ steps.test-python-nss-ng.outputs.python_project_name }}
          PACKAGE_NAME: ${{ steps.test-python-nss-ng.outputs.python_package_name }}
          SOURCE: ${{ steps.test-python-nss-ng.outputs.source }}
        run: |
          # Validate Action Output
          ERROR=""
          project_file="$PROJECT_FILE"
          if [ "$project_file" != "pyproject.toml" ]; then
            echo "Unexpected return value for: python_project_file ❌"
            echo "Returned: $project_file"
            echo "Expected: pyproject.toml"
            ERROR="true"
          fi
          project_name="$PROJECT_NAME"
          if [ "$project_name" != "python-nss-ng" ]; then
            echo "Unexpected return value for: python_project_name ❌"
            echo "Returned: $project_name"
            echo "Expected: python-nss-ng"
            ERROR="true"
          fi
          package_name="$PACKAGE_NAME"
          if [ "$package_name" != "python_nss_ng" ]; then
            echo "Unexpected return value for: python_package_name ❌"
            echo "Returned: $package_name"
            echo "Expected: python_nss_ng"
            ERROR="true"
          fi
          source="$SOURCE"
          if [ "$source" != "pyproject.toml" ]; then
            echo "Unexpected return value for: source ❌"
            echo "Returned: $source"
            echo "Expected: pyproject.toml"
            ERROR="true"
          fi
          if [ "$ERROR" != "true" ]; then
            echo "All output tests passed for python-nss-ng ✅"
          else
            echo "At least one output test failed for python-nss-ng ❌"
            exit 1
          fi

      # Third test: synthetic setup.cfg fixture (legacy pbr/setuptools).
      # Verifies the new setup.cfg → [metadata] name extraction path,
      # including: case-insensitive section/key matching, `:` delimiter
      # support, inline `;` comment stripping, and selection of source.
      - name: "Create setup.cfg fixture"
        shell: bash
        run: |
          mkdir -p test-setup-cfg
          cat > test-setup-cfg/setup.cfg <<'EOF'
          [Metadata]
          Name: lfdocs-conf  ; canonical project name
          author = LF

          [options.entry_points]
          name = wrong
          EOF
          cat > test-setup-cfg/setup.py <<'EOF'
          from setuptools import setup
          setup(setup_requires=["pbr"], pbr=True)
          EOF

      - name: "Run Action: ${{ github.repository }} [setup.cfg fixture]"
        id: test-setup-cfg
        uses: $/
        with:
          path_prefix: "test-setup-cfg/"

      - name: "Validate Action Output: setup.cfg fixture"
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.test-setup-cfg.outputs.python_project_file }}
          PROJECT_NAME: ${{ steps.test-setup-cfg.outputs.python_project_name }}
          PACKAGE_NAME: ${{ steps.test-setup-cfg.outputs.python_package_name }}
          SOURCE: ${{ steps.test-setup-cfg.outputs.source }}
        run: |
          # Validate setup.cfg fixture extraction
          ERROR=""
          if [ "$PROJECT_FILE" != "setup.cfg" ]; then
            echo "Unexpected python_project_file: $PROJECT_FILE ❌"
            ERROR="true"
          fi
          if [ "$PROJECT_NAME" != "lfdocs-conf" ]; then
            echo "Unexpected python_project_name: $PROJECT_NAME ❌"
            ERROR="true"
          fi
          if [ "$PACKAGE_NAME" != "lfdocs_conf" ]; then
            echo "Unexpected python_package_name: $PACKAGE_NAME ❌"
            ERROR="true"
          fi
          if [ "$SOURCE" != "setup.cfg" ]; then
            echo "Unexpected source: $SOURCE ❌"
            ERROR="true"
          fi
          if [ "$ERROR" != "true" ]; then
            echo "All output tests passed for setup.cfg fixture ✅"
          else
            exit 1
          fi

      # Fourth test: setup.cfg present but with no [metadata] name should
      # fall through to setup.py.
      - name: "Create setup.cfg fall-through fixture"
        shell: bash
        run: |
          mkdir -p test-setup-cfg-fallthrough
          cat > test-setup-cfg-fallthrough/setup.cfg <<'EOF'
          [options]
          packages = find:
          EOF
          cat > test-setup-cfg-fallthrough/setup.py <<'EOF'
          from setuptools import setup
          setup(name="fallthrough-pkg")
          EOF

      - name: "Run Action: ${{ github.repository }} [fall-through]"
        id: test-fallthrough
        uses: $/
        with:
          path_prefix: "test-setup-cfg-fallthrough/"

      - name: "Validate Action Output: fall-through"
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.test-fallthrough.outputs.python_project_file }}
          PROJECT_NAME: ${{ steps.test-fallthrough.outputs.python_project_name }}
          SOURCE: ${{ steps.test-fallthrough.outputs.source }}
        run: |
          # Validate setup.cfg → setup.py fall-through
          ERROR=""
          if [ "$PROJECT_FILE" != "setup.py" ]; then
            echo "Unexpected python_project_file: $PROJECT_FILE ❌"
            ERROR="true"
          fi
          if [ "$PROJECT_NAME" != "fallthrough-pkg" ]; then
            echo "Unexpected python_project_name: $PROJECT_NAME ❌"
            ERROR="true"
          fi
          if [ "$SOURCE" != "setup.py" ]; then
            echo "Unexpected source: $SOURCE ❌"
            ERROR="true"
          fi
          if [ "$ERROR" != "true" ]; then
            echo "All output tests passed for fall-through fixture ✅"
          else
            exit 1
          fi

      # Fifth test: hybrid project carrying a [build-system]-only
      # pyproject.toml (PEP 517) alongside a setup.cfg [metadata] name.
      # This is the pbr / setuptools-legacy layout (e.g. lfdocs-conf):
      # pyproject.toml exists but defines no [project] name, so the
      # action must not abort on the empty pyproject result and must
      # resolve the name from setup.cfg.
      - name: "Create build-system-only pyproject.toml fixture"
        shell: bash
        run: |
          mkdir -p test-pyproject-build-only
          cat > test-pyproject-build-only/pyproject.toml <<'EOF'
          [build-system]
          requires = ["pbr>=7.0.0"]
          build-backend = "pbr.build"
          EOF
          cat > test-pyproject-build-only/setup.cfg <<'EOF'
          [metadata]
          name = lfdocs-conf
          author = LF
          EOF
          cat > test-pyproject-build-only/setup.py <<'EOF'
          from setuptools import setup
          setup(pbr=True)
          EOF

      - name: "Run Action: ${{ github.repository }} [build-system-only]"
        id: test-build-only
        uses: $/
        with:
          path_prefix: "test-pyproject-build-only/"

      - name: "Validate Action Output: build-system-only pyproject.toml"
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.test-build-only.outputs.python_project_file }}
          PROJECT_NAME: ${{ steps.test-build-only.outputs.python_project_name }}
          PACKAGE_NAME: ${{ steps.test-build-only.outputs.python_package_name }}
          SOURCE: ${{ steps.test-build-only.outputs.source }}
        run: |
          # Validate [build-system]-only pyproject.toml falls back to setup.cfg
          ERROR=""
          if [ "$PROJECT_FILE" != "setup.cfg" ]; then
            echo "Unexpected python_project_file: $PROJECT_FILE ❌"
            ERROR="true"
          fi
          if [ "$PROJECT_NAME" != "lfdocs-conf" ]; then
            echo "Unexpected python_project_name: $PROJECT_NAME ❌"
            ERROR="true"
          fi
          if [ "$PACKAGE_NAME" != "lfdocs_conf" ]; then
            echo "Unexpected python_package_name: $PACKAGE_NAME ❌"
            ERROR="true"
          fi
          if [ "$SOURCE" != "setup.cfg" ]; then
            echo "Unexpected source: $SOURCE ❌"
            ERROR="true"
          fi
          if [ "$ERROR" != "true" ]; then
            echo "All output tests passed for build-system-only fixture ✅"
          else
            exit 1
          fi

  ### Name extraction: quoting, spacing, scoping and parser modes ###
  # Every fixture runs in every parser mode: tomllib on the runner's
  # own Python, a real Python 3.10 (no tomllib, so pyproject.toml uses
  # the awk fallback), and an image with no python3 at all (awk
  # fallback for both pyproject.toml and setup.py).
  name-extraction:
    name: "Name Extraction [${{ matrix.mode.id }}]"
    runs-on: ubuntu-24.04
    # An empty image runs the job on the runner itself
    container: ${{ matrix.mode.image }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # One job per parser mode; each runs every fixture in turn
        mode:
          - id: "tomllib"
            image: ""
          - id: "no-tomllib"
            image: "python:3.10-slim@sha256:9d53d8d4c0e882f61913025db53b3aec4ef74336082a9ab47d8a14e9e8329b00"
          - id: "no-python"
            image: "ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
    steps:
      - name: "Check parser mode: ${{ matrix.mode.id }}"
        shell: bash
        env:
          MODE: ${{ matrix.mode.id }}
        run: |
          # Fail unless the environment provides the mode under test, so
          # an image change cannot silently skip a parser path
          if command -v python3 > /dev/null 2>&1; then
            python3 --version
            if python3 -c 'import tomllib' 2> /dev/null; then
              actual="tomllib"
            else
              actual="no-tomllib"
            fi
          else
            actual="no-python"
          fi
          if [ "$actual" != "$MODE" ]; then
            echo "Expected parser mode $MODE, found $actual ❌"
            exit 1
          fi
          echo "Parser mode: $actual ✅"

      # Each fixture lives in f/NN/ with its expectations alongside:
      # expect (the name, or empty when the action must fail),
      # file (the source it must come from) and case (its title).
      # Fixtures listed in skip are not asserted in that mode; the
      # import-blind awk fallback cannot resolve setup() imports.
      # <NUL> in a fixture becomes a raw NUL byte (GNU sed).
      - name: "Create fixtures"
        shell: bash
        run: |
          # Create fixtures
          fixture() {
            mkdir -p "f/$1"
            printf '%s\n' "$2" > "f/$1/case"
            printf '%s\n' "$3" > "f/$1/file"
            printf '%s\n' "$4" > "f/$1/expect"
            printf '%s\n' "$5" > "f/$1/skip"
            sed 's/<NUL>/\x00/g' > "f/$1/$3"
          }
          fixture 01 'pyproject single quotes' pyproject.toml 'my-project' '' <<'EOF'
          [project]
          name = 'my-project'
          version = "0.1.0"
          EOF
          fixture 02 'pyproject no spaces' pyproject.toml 'my-project' '' <<'EOF'
          [project]
          name="my-project"
          version = "0.1.0"
          EOF
          fixture 03 'pyproject extra spaces' pyproject.toml 'my-project' '' <<'EOF'
          [project]
          name  =  "my-project"
          version = "0.1.0"
          EOF
          fixture 04 'pyproject uv index before project' pyproject.toml 'my-project' '' <<'EOF'
          [[tool.uv.index]]
          name = "pytorch"
          url = "https://download.pytorch.org/whl/cpu"

          [project]
          name = "my-project"
          version = "0.1.0"
          EOF
          fixture 05 'pyproject poetry only' pyproject.toml 'my-project' '' <<'EOF'
          [tool.poetry]
          name = "my-project"
          version = "0.1.0"
          EOF
          fixture 06 'pyproject project wins over poetry' pyproject.toml 'my-project' '' <<'EOF'
          [tool.poetry]
          name = "poetry-name"
          version = "0.1.0"

          [project]
          name = "my-project"
          version = "0.1.0"
          EOF
          fixture 07 'pyproject NUL escape' pyproject.toml '' '' <<'EOF'
          [project]
          name = "foo\u0000bar"
          version = "0.1.0"
          EOF
          fixture 08 'pyproject raw NUL' pyproject.toml '' '' <<'EOF'
          [project]
          name = "foo<NUL>bar"
          version = "0.1.0"
          EOF
          fixture 09 'setup.py single quotes' setup.py 'my-project' '' <<'EOF'
          from setuptools import setup

          setup(name='my-project')
          EOF
          fixture 10 'setup.py spaces around equals' setup.py 'my-project' '' <<'EOF'
          from setuptools import setup

          setup(
              name = "my-project",
              version="0.1.0",
          )
          EOF
          fixture 11 'setup.py package_name before name' setup.py 'my-project' '' <<'EOF'
          from setuptools import setup

          package_name="helper"

          setup(
              name="my-project",
              packages=[package_name],
          )
          EOF
          fixture 12 'setup.py aliased setup import' setup.py 'my-project' '' <<'EOF'
          from setuptools import setup as setuptools_setup

          setuptools_setup(name="my-project")
          EOF
          fixture 13 'setup.py module alias' setup.py 'my-project' '' <<'EOF'
          import setuptools as st

          st.setup(name="my-project")
          EOF
          fixture 14 'setup.py unrelated helper.setup call' setup.py 'my-project' 'no-python' <<'EOF'
          import helper
          import setuptools

          helper.setup(name="helper")
          setuptools.setup(name="my-project")
          EOF
          fixture 15 'setup.py setup from another module' setup.py 'my-project' 'no-python' <<'EOF'
          from mylib import setup
          from setuptools import setup as st_setup

          setup(name="helper")
          st_setup(name="my-project")
          EOF
          fixture 16 'setup.py packaging setup shadowed by later import' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup
          from mylib import setup

          setup(name="helper")
          EOF
          fixture 17 'setup.py later packaging import shadows other setup' setup.py 'my-project' 'no-python' <<'EOF'
          from mylib import setup
          from setuptools import setup

          setup(name="my-project")
          EOF
          fixture 18 'setup.py NUL escape' setup.py '' '' <<'EOF'
          from setuptools import setup

          setup(name="foo\x00bar")
          EOF
          fixture 19 'setup.py raw NUL' setup.py '' '' <<'EOF'
          from setuptools import setup

          setup(name="foo<NUL>bar")
          EOF
          fixture 20 'setup.py setup() in a function before the real call' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def helper():
              setup(name="helper")


          setup(name="my-project")
          EOF
          fixture 21 'setup.py function-local import' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def unused():
              from mylib import setup


          setup(name="my-project")
          EOF
          fixture 22 'setup.py setup() only inside main()' setup.py 'my-project' '' <<'EOF'
          from setuptools import setup


          def main():
              setup(name="my-project")


          if __name__ == "__main__":
              main()
          EOF
          fixture 23 'setup.py local def setup' setup.py '' 'no-python' <<'EOF'
          def setup(**kwargs):
              pass


          setup(name="helper")
          EOF
          fixture 24 'setup.py star import from another module' setup.py '' 'no-python' <<'EOF'
          from mylib import *

          setup(name="helper")
          EOF
          fixture 25 'setup.py setup() with no import' setup.py '' 'no-python' <<'EOF'
          setup(name="helper")
          EOF
          fixture 26 'setup.py packaging module root rebound' setup.py '' 'no-python' <<'EOF'
          import distutils.core
          import helper as distutils

          distutils.core.setup(name="helper")
          EOF
          fixture 27 'setup.py import in an unrelated function' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def unused():
              from mylib import setup


          def main():
              setup(name="my-project")


          main()
          EOF
          fixture 28 'setup.py class body import hidden from method' setup.py '' 'no-python' <<'EOF'
          class Builder:
              from setuptools import setup

              def run(self):
                  setup(name="helper")


          Builder().run()
          EOF
          fixture 29 'setup.py attribute assignment on the module' setup.py 'my-project' '' <<'EOF'
          import setuptools

          setuptools.version = "1"
          setuptools.setup(name="my-project")
          EOF
          fixture 30 'setup.py parameter shadows setup import' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup


          def main(setup):
              setup(name="helper")


          main(print)
          EOF
          fixture 31 'setup.py for loop rebinds setup' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup

          for setup in [print]:
              pass
          setup(name="helper")
          EOF
          fixture 32 'setup.py comprehension variable does not leak' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup

          names = [setup for setup in ["x"]]
          setup(name="my-project")
          EOF
          fixture 33 'setup.py comprehension target shadows setup' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup

          [setup(name="helper") for setup in [print]]
          setup(name="my-project")
          EOF
          fixture 34 'setup.py match capture rebinds setup' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup

          match print:
              case setup:
                  pass
          setup(name="helper")
          EOF
          fixture 35 'setup.py setup() in a default value' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def configure(value=setup(name="my-project")):
              return value
          EOF
          fixture 36 'setup.py default runs before def rebinds setup' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def setup(value=setup(name="my-project")):
              return value
          EOF
          fixture 37 'setup.py walrus in a comprehension condition' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup

          [setup(name="helper") for _ in [0] if (setup := print)]
          EOF
          fixture 38 'pyproject non-string project name, poetry name' pyproject.toml 'my-project' '' <<'EOF'
          [project]
          name = 123

          [tool.poetry]
          name = "my-project"
          version = "0.1.0"
          EOF
          fixture 39 'setup.py setup() in a deferred annotation' setup.py 'my-project' 'no-python' <<'EOF'
          from __future__ import annotations

          from setuptools import setup


          def configure(value: setup(name="fake")) -> None:
              pass


          setup(name="my-project")
          EOF
          fixture 40 'setup.py with item binds before the next item' setup.py '' 'no-python' <<'EOF'
          from contextlib import nullcontext

          from setuptools import setup

          with nullcontext(lambda **_: nullcontext()) as setup, setup(name="helper"):
              pass
          EOF
          fixture 41 'setup.cfg raw NUL' setup.cfg '' '' <<'EOF'
          [metadata]
          name = foo<NUL>bar
          EOF
          fixture 42 'setup.py del setup' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup

          del setup
          setup(name="helper")
          EOF
          fixture 43 'setup.py lambda walrus in a comprehension' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup

          [(lambda: (setup := print)) for _ in [0]]
          setup(name="my-project")
          EOF
          fixture 44 'setup.py call before a local assignment' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup


          def main():
              setup(name="helper")
              setup = print


          main()
          EOF
          fixture 45 'setup.py local annotation without a value' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup


          def main():
              setup: object
              setup(name="helper")


          main()
          EOF
          fixture 46 'setup.py packaging import in a dead branch' setup.py '' 'no-python' <<'EOF'
          def setup(**kwargs):
              pass


          if False:
              from setuptools import setup
          setup(name="helper")
          EOF
          fixture 47 'setup.py try/except ImportError fallback' setup.py 'my-project' 'no-python' <<'EOF'
          try:
              from setuptools import setup
          except ImportError:
              from distutils.core import setup

          setup(name="my-project")
          EOF
          fixture 48 'setup.py loop rebinds setup after the call' setup.py '' 'no-python' <<'EOF'
          from setuptools import setup

          for attempt in [1, 2]:
              if attempt == 2:
                  setup(name="helper")
              setup = print
          EOF
          fixture 49 'setup.py dead call before the real call' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup

          if False:
              setup(name="helper")
          setup(name="my-project")
          EOF
          fixture 50 'setup.py uncalled function before main' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def unused():
              setup(name="helper")


          def main():
              setup(name="my-project")


          main()
          EOF
          fixture 51 'setup.py conditional del before the real call' setup.py 'my-project' 'no-python' <<'EOF'
          import os

          from setuptools import setup

          if os.environ.get("NEVER_SET_FOR_THIS_TEST"):
              del setup
          setup(name="my-project")
          EOF
          fixture 52 'setup.py call after return in main' setup.py 'my-project' 'no-python' <<'EOF'
          from setuptools import setup


          def main():
              return
              setup(name="wrong-name")


          def build():
              setup(name="my-project")


          main()
          build()
          EOF
